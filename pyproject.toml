[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ragent"
version = "1.0.0"
description = "RAG-based conversation indexer for Claude Code hooks"
requires-python = ">=3.10"
dependencies = [
    "astchunk",
    "peft",
    "qdrant-client",
    "sentence_transformers",
    "llama-cpp-python[server]",
    "uvicorn",
    "openai",
    "fastembed",
    "json-repair",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pyinstaller>=6.0",
]

[tool.setuptools.packages.find]
include = ["ragent*"]
