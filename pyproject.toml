[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ragent"
version = "0.1.0"
description = "RAG-based conversation indexer for Claude Code hooks"
requires-python = ">=3.10"
dependencies = [
    "astchunk",
    "peft",
    "qdrant-client",
    "sentence_transformers",
    "llama-cpp-python[server]",
    "uvicorn",
    "openai",
    "fastembed",
    "json-repair"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
# 오프라인 검색 평가 하네스(ragent/evaluation) 전용 의존성.
# 프로덕션 런타임에는 불필요하므로 별도 extra 로 분리한다: pip install -e ".[eval]"
eval = [
    "ranx",
    "anthropic",  # GT 라벨링 파이프라인(gt_labeling.py)의 gen/judge LLM 호출용
]

[tool.setuptools.packages.find]
include = ["ragent*"]
